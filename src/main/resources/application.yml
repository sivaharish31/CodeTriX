spring:
  application:
    name: codetrix

  datasource:
    url: jdbc:postgresql://localhost:5432/codetrix
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:Y29kZXRyaXgtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNA==}
  expiration: 86400000
  issuer: codetrix

codetrix:
  max-teams: 27

ctf:
  upload:
    dir: ${CTF_UPLOAD_DIR:uploads/ctf}
  rate-limit:
    attempts: 5
    window-seconds: 60

execution:
  max-concurrent-executions: 4
  queue-capacity: 100
  default-time-limit-ms: 2000
  default-memory-limit-mb: 256
  max-time-limit-ms: 10000
  max-memory-limit-mb: 512
  compilation-timeout-ms: 30000
  temp-directory: ${EXECUTION_TEMP_DIR:/tmp/codetrix}
  cleanup-enabled: true
  docker:
    network: none
    privileged: false
    read-only-root-fs: true
    cpu-period: 100000
    cpu-quota: 50000
    pids-limit: 64
    user: runner
    drop-all-capabilities: true
  security:
    enable-seccomp: true
    enable-app-armor: true
    no-new-privileges: true
    max-output-size-kb: 64
    max-source-code-size-kb: 128

logging:
  level:
    com.codetrix: INFO
    org.springframework.security: WARN
